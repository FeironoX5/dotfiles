	{
		image-path 		=/home/glebkiva/.local/share/icons/Colloid-Light/apps/scalable/figma.svg;
		command			= /opt/helium/helium-wrapper --profile-directory=Default --app-id=maahljhncnbidappjlnffjokhkicpbhe;
